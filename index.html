<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ajedrez Garabato</title>
  <meta name="description" content="Ajedrez para jugar en familia, dibujado a pluma sobre una hoja de libreta.">
  <meta name="theme-color" content="#f1ebdc">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Garabato">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/patrick-hand.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/kalam-bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/paper.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <svg id="doodles" aria-hidden="true"></svg>

  <!-- MENÚ -->
  <main id="menu" class="screen">
    <header class="masthead">
      <h1 class="title">Ajedrez <span>Garabato</span></h1>
      <div class="hero" aria-hidden="true"></div>
    </header>
    <nav class="modes" aria-label="Elige cómo jugar">
      <button class="mode hi" data-go="resume" hidden>
        <span class="mode-art" id="resume-art"></span>
        <span class="mode-txt"><b>Seguir partida</b><small id="resume-info"></small></span>
      </button>
      <button class="mode" data-go="bot">
        <span class="mode-art" data-art="k" data-color="b"></span>
        <span class="mode-txt"><b>Contra el bot</b><small>De dormilón a experto</small><span class="wins" id="bot-wins"></span></span>
      </button>
      <button class="mode red" data-go="pair">
        <span class="mode-art duo"><i data-art="p" data-color="w"></i><i data-art="p" data-color="b"></i></span>
        <span class="mode-txt"><b>En pareja</b><small>Dos jugadores, un tablero</small></span>
      </button>
      <button class="mode" data-go="learn">
        <span class="mode-art" data-art="b" data-color="w" data-mood="happy"></span>
        <span class="mode-txt"><b>Aprender a mover</b><small>12 lecciones cortitas</small></span>
      </button>
    </nav>
    <div class="menu-foot">
      <button class="btn theme-btn" data-go="themes"><span class="theme-mini"></span><span>Personajes</span></button>
      <button class="btn theme-btn" data-go="settings"><i data-icon="gear"></i><span>Ajustes</span></button>
    </div>
  </main>

  <!-- PERSONAJES (tema) -->
  <section id="themes" class="screen" hidden>
    <header class="topbar">
      <button class="btn icon" data-go="menu" aria-label="Volver al menú"><i data-icon="back"></i></button>
      <h2>Personajes</h2>
      <span class="icon-spacer"></span>
    </header>
    <p class="lesson-text">¿Con quiénes quieres jugar? Toca un equipo.</p>
    <div id="theme-list" class="theme-list"></div>
  </section>

  <!-- AJUSTES -->
  <section id="settings" class="screen" hidden>
    <header class="topbar">
      <button class="btn icon" data-go="menu" aria-label="Volver al menú"><i data-icon="back"></i></button>
      <h2>Ajustes</h2>
      <span class="icon-spacer"></span>
    </header>
    <div class="settings">
      <div class="opt">
        <p>Colores de las piezas</p>
        <div class="seg" data-opt="scheme">
          <button data-val="tinta"><span class="sch-art" data-sch="tinta"></span>Pluma <small>azul y rojo</small></button>
          <button data-val="clasico"><span class="sch-art" data-sch="clasico"></span>Clásico <small>blancas y negras</small></button>
          <button data-val="colores"><span class="sch-art" data-sch="colores"></span>Colorido <small>muchos colores</small></button>
        </div>
      </div>
      <div class="opt">
        <p>Voz de Lápiz</p>
        <div class="seg" data-opt="voz">
          <button data-val="mujer"><i data-icon="voice"></i>Mujer</button>
          <button data-val="hombre"><i data-icon="voice"></i>Hombre</button>
        </div>
      </div>
      <div class="opt">
        <p>Música</p>
        <div class="seg wrap" data-opt="musicStyle">
          <button data-val="infantil"><i data-icon="music"></i>Infantil <small>para peques</small></button>
          <button data-val="aventura"><i data-icon="music"></i>Aventura <small>de exploradores</small></button>
          <button data-val="videojuego"><i data-icon="music"></i>Videojuego <small>8 bits</small></button>
          <button data-val="lofi"><i data-icon="music"></i>Lo-fi <small>para concentrarse</small></button>
          <button data-val="espacial"><i data-icon="music"></i>Espacial <small>sintetizadores</small></button>
        </div>
      </div>
      <div class="opt">
        <p>Sonido</p>
        <div class="audio-toggles" role="group" aria-label="Sonido">
          <button class="btn ghost" data-act="fx"></button>
          <button class="btn ghost" data-act="voice"></button>
          <button class="btn ghost" data-act="music"></button>
        </div>
      </div>
    </div>
  </section>

  <!-- OPCIONES DE PARTIDA -->
  <section id="setup" class="screen" hidden>
    <h2 id="setup-title">Contra el bot</h2>
    <div class="opt bot-only">
      <p>¿Qué tan difícil?</p>
      <div class="seg wrap" data-opt="level">
        <button data-val="0" data-art="p" data-mood="sleepy">Dormilón</button>
        <button data-val="1" data-art="p">Fácil</button>
        <button data-val="2" data-art="n">Medio</button>
        <button data-val="3" data-art="q">Difícil</button>
        <button data-val="4" data-art="k">Experto</button>
      </div>
    </div>
    <div class="opt bot-only">
      <p>¿Con qué color juegas?</p>
      <div class="seg" data-opt="color">
        <button data-val="w" class="ink-w" data-art="k" data-color="w"><span data-side="w">Azul</span> <small>empieza</small></button>
        <button data-val="b" class="ink-b" data-art="k" data-color="b"><span data-side="b">Rojo</span></button>
        <button data-val="r"><span class="qmark" aria-hidden="true">?</span>Sorpresa</button>
      </div>
    </div>
    <div class="opt">
      <label class="check"><input type="checkbox" data-check="classic"><span><b>Modo clásico</b>Reglas de torneo: cada jugador tiene su reloj y pierde si se le acaba el tiempo. Sin modo guía, sin deshacer y sin pistas.</span></label>
      <div class="seg wrap clock-opt" data-opt="clock">
        <button data-val="3">3 min</button>
        <button data-val="5">5 min</button>
        <button data-val="10">10 min</button>
        <button data-val="15">15 min</button>
        <button data-val="30">30 min</button>
      </div>
    </div>
    <div class="opt bot-only guide-opt">
      <label class="check"><input type="checkbox" data-check="guide"><span><b>Modo guía</b>Lápiz te enseña una buena jugada en cada turno y te avisa antes de que te coman una pieza.</span></label>
    </div>
    <div class="opt">
      <p>Ayudas</p>
      <div class="seg" data-opt="helps">
        <button data-val="muchas">Muchas <small>5–7 años</small></button>
        <button data-val="algunas">Algunas <small>8–10</small></button>
        <button data-val="pocas">Pocas <small>11+</small></button>
      </div>
      <p class="note" id="helps-note"></p>
    </div>
    <div class="opt">
      <p>Personajes</p>
      <div class="seg wrap" data-opt="set">
        <button data-val="garabato" data-art="k" data-set="garabato">Garabato</button>
        <button data-val="bosque" data-art="k" data-set="bosque">Bosque</button>
        <button data-val="mar" data-art="k" data-set="mar">Mar</button>
        <button data-val="robots" data-art="k" data-set="robots">Robots</button>
        <button data-val="dinos" data-art="k" data-set="dinos">Dinos</button>
        <button data-val="espacio" data-art="k" data-set="espacio">Espacio</button>
        <button data-val="clasicas" data-art="k" data-set="clasicas">Clásicas</button>
      </div>
    </div>
    <div class="opt pair-only">
      <p>Tablero</p>
      <div class="seg" data-opt="spin">
        <button data-val="0"><i data-icon="board"></i>Quieto</button>
        <button data-val="1"><i data-icon="flip"></i>Gira cada turno</button>
      </div>
    </div>
    <div class="row">
      <button class="btn ghost" data-go="menu"><i data-icon="back"></i> Volver</button>
      <button class="btn big" data-act="start">¡A jugar!</button>
    </div>
  </section>

  <!-- PARTIDA -->
  <section id="game" class="screen" hidden>
    <header class="topbar">
      <button class="btn icon" data-go="menu" aria-label="Menú"><i data-icon="menu"></i></button>
      <button class="lapiz-btn lapiz-slot" data-act="lapiz" aria-label="Lápiz: pista o ayuda"></button>
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <button class="btn icon" data-act="mute" aria-label="Sonido"></button>
    </header>
    <div class="arena">
      <div class="player" id="p-top"></div>
      <div class="board-wrap"><svg id="board" class="board" role="img" aria-label="Tablero de ajedrez"></svg></div>
      <div class="world" id="world"></div>
      <div class="player" id="p-bottom"></div>
    </div>
    <nav class="controls">
      <button class="btn" data-act="undo"><i data-icon="undo"></i> <span>Deshacer</span></button>
      <button class="btn" data-act="hint"><i data-icon="bulb"></i> <span>Pista</span></button>
      <button class="btn" data-act="flip"><i data-icon="flip"></i> <span>Girar</span></button>
      <button class="btn red" data-act="again" hidden><i data-icon="again"></i> <span>Otra vez</span></button>
    </nav>
  </section>

  <!-- APRENDER -->
  <section id="learn" class="screen" hidden>
    <header class="topbar">
      <button class="btn icon" data-go="menu" aria-label="Volver al menú"><i data-icon="back"></i></button>
      <h2>Aprender a mover</h2>
      <span class="icon-spacer"></span>
    </header>
    <div id="lessons" class="lessons"></div>
  </section>

  <section id="lesson" class="screen" hidden>
    <header class="topbar">
      <button class="btn icon" data-act="lessons" aria-label="Volver a las lecciones"><i data-icon="back"></i></button>
      <h2 id="lesson-title"></h2>
      <button class="lapiz-btn lapiz-slot" data-act="lapiz" aria-label="Lápiz lee la lección"></button>
    </header>
    <p id="lesson-text" class="lesson-text"></p>
    <div class="board-wrap"><svg id="lesson-board" class="board" role="img" aria-label="Tablero de práctica"></svg></div>
    <p id="lesson-msg" class="lesson-msg" role="status" aria-live="polite"></p>
    <nav class="controls">
      <button class="btn" data-act="lesson-reset"><i data-icon="again"></i> <span>Otra vez</span></button>
      <button class="btn red" data-act="lesson-next">Siguiente</button>
    </nav>
  </section>

  <!-- DIÁLOGO (fin de partida, coronación) -->
  <div id="dialog" class="overlay" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <div class="dlg-art"></div>
      <h2 id="dlg-title"></h2>
      <p id="dlg-text"></p>
      <div class="dlg-btns"></div>
    </div>
  </div>
</body>
</html>
